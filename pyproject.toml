[build-system]
requires = ["setuptools>=84.2", "setuptools_scm>=10.3"]
build-backend = "setuptools.build_meta"

[project]
name = "localport"
dynamic = ["version"]
description = "Universal port forwarding manager with health monitoring"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Larry Dawson"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: System :: Networking",
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.27.3",
    "rich>=15.0.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "aiohttp>=3.14.5",
    "psutil>=7.2.2",
    "structlog>=26.1.0",
    "watchdog>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "black==26.10.1",
    "ruff==0.17.3",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest-xdist>=3.8.0",
]
kafka = [
    "kafka-python>=3.0.12",
]
postgres = [
    "psycopg[binary]>=3.3.7",
]
all = [
    "localport[kafka,postgres]",
]

[project.urls]
Homepage = "https://github.com/dawsonlp/localport"
Repository = "https://github.com/dawsonlp/localport"
Documentation = "https://github.com/dawsonlp/localport#readme"
"Bug Tracker" = "https://github.com/dawsonlp/localport/issues"

[project.scripts]
localport = "localport.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# Focused on high-signal rules that catch real bugs. Formatting is owned by
# black; pycodestyle (E/W), pyupgrade (UP), and comprehension (C4) style rules
# are intentionally left out to keep the linter a bug-catcher, not a style nag.
select = [
    "F",  # pyflakes — undefined names, unused imports, real errors
    "B",  # flake8-bugbear — likely bugs and gotchas
    "I",  # isort — import ordering
]
ignore = [
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "kafka.*",
    "psutil.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*:",
    "ignore::RuntimeWarning:unittest.mock:",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "pytest-xdist>=3.8.0",
    "black==26.10.1",
    "ruff==0.17.3",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pip-audit>=2.10.1",
    "bandit>=1.9.4",
]
